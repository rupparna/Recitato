<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Recitato</title>
        <style>
           body{background: #2a1a08;color: #ffd700; font-family: monospace; text-align:center;padding:20px;margin:0}
            h1{font-size:2rem; margin: 10px 0;color:#ffaa33}
          .card{background:#42260b;border: 2px dashed #ffd700; padding: 15px; margin: 20px auto;max-width: 320px;border-radius: 8px; min-height: 80px;display: flex; align-items: center; justify-content: center; flex-direction:column}
          button{background: #ffd700; color: #2a1a08;border: none;padding: 12px 24px;font-size: 1.2rem;font-weight:bold; cursor: pointer; border-radius: 4px}
          button:active{transform: scale(0.95)}
          #p{font-size:1.5rem}
           
        </style>
    </head>
<body>
    <h1>Recitato🥔</h1>
    <p>Instant Potato Recipes</p>
    <div class="card"><div id="r">Click to generate potato magic🤩🥔</div>
    <div id="s"></div>
    </div>
    <button onclick="gen()">Cook Recipe</button>
    <script>
       const a=['Crispy','Cheesy','Spicy','Garlic','Loaded','Smashed','Truffle','Honey-Glazed'],
      b=['Baked','Fried','Mashed','Roasted','Loaded','Stuffed','Crispy','Curried'],
      c=['Potato Skins','Wedges','Gnocchi','Hash Browns','Tater Tots','Fries','Soup','Casserole'];
      function gen(){
        let p=Math.random()*a.length|0,
      q=Math.random()*b.length|0,
      r=Math.random()*c.length|0;

      document.getElementById('r').innerHTML=`${a[p]} ${b[q]} ${c[r]}`;
      document.getElementById('s').innerText="Yeah, this will only recommend you the recipes, not the actual process... :p";
}
    </script>
</body>
</html>
